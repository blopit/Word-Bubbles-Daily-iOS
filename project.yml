name: WordBubbles
options:
  bundleIdPrefix: com.blopit
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: E2FPXMPTD9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
packages:
  WordBubblesCore:
    path: WordBubblesCore
targets:
  WordBubbles:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: WordBubblesCore
    settings:
      base:
        # The bundle ID of the live 2018 App Store app (id1331764983); this build replaces it.
        PRODUCT_BUNDLE_IDENTIFIER: com.blopit.BBL
        PRODUCT_NAME: Word Bubbles
        PRODUCT_MODULE_NAME: WordBubbles
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        # The 2018 app runs on iPad, and an update can't drop a device family.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Word Bubbles
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  WordBubblesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: WordBubbles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blopit.BBL.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Word Bubbles.app/Word Bubbles"
        BUNDLE_LOADER: "$(TEST_HOST)"
  WordBubblesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: WordBubbles
      - package: WordBubblesCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blopit.BBL.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WordBubbles
        SWIFT_OBJC_BRIDGING_HEADER: AppUITests/PointerPath-Bridging.h
schemes:
  WordBubbles:
    build:
      targets:
        WordBubbles: all
        WordBubblesTests: [test]
        WordBubblesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WordBubblesTests
        - WordBubblesUITests
